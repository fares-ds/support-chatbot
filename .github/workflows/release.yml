name: Release

# A vX.Y.Z tag on main is a release (ADR-0027). It builds the backend and Caddy images for
# linux/amd64, scans them, pushes them to GitHub Container Registry under the version, and attaches
# the install bundle to a GitHub release (OPS-1). Pull requests that change what a release ships
# run the same build without publishing, and install the bundle with sc on the runner. Both run the
# upgrade test from the previous release (OPS-4); a release publishes only once it passes.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - backend/**
      - deploy/**
      - .github/workflows/release.yml

permissions:
  contents: read

env:
  BACKEND: ghcr.io/fares-ds/support-chatbot-backend
  CADDY: ghcr.io/fares-ds/support-chatbot-caddy

jobs:
  check:
    name: Images, bundle and sc install, without publishing
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read # sc install logs in to GitHub Container Registry
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      VERSION: 0.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to Docker Hub, for a pull limit of our own
        # Anonymous pulls share the runners' addresses and hit Docker Hub's limit. Skipped where
        # the secrets are missing, such as a fork's pull request.
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      - name: Bundle and sc tests, on Python 3.10, the oldest sc supports
        run: uv run --no-project --python 3.10 --with pytest==9.1.1 pytest deploy/tests
      - name: Lint and types
        working-directory: deploy
        run: |
          uvx ruff@0.16.10 check .
          uvx ruff@0.16.10 format --check .
          uv run --no-project --python 3.10 --with mypy==2.4.0 mypy sc build_bundle.py upgrade_test.py
      - name: Make room for the Ollama image, and for the second install's disk check
        run: |
          # sc install wants 30 GB free; the restore test installs twice on one runner, the second
          # time with the first install's 8 GB still on disk. One at a time, these took 5.5 minutes.
          df --human-readable /
          for directory in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/.ghcup /usr/share/swift /usr/lib/jvm /usr/local/share/powershell \
            /usr/local/lib/node_modules; do
            sudo rm -rf "$directory" &
          done
          wait
          df --human-readable /
      - name: Build the images
        run: |
          docker build --platform linux/amd64 --tag "$BACKEND:$VERSION" backend
          docker build --platform linux/amd64 --tag "$CADDY:$VERSION" deploy/caddy
      - name: Build the bundle
        run: python3 deploy/build_bundle.py "$VERSION" dist
      - name: sc install on a fresh runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/release"
          tar --extract --gzip --file "dist/support-chatbot-$VERSION.tar.gz" --directory "$RUNNER_TEMP/release"
          # sc install pulls as the service account, which has no Docker Hub login. Pulled here,
          # logged in, the images are present, and its --policy missing pulls nothing more.
          printf 'SC_DOMAIN=localhost\nSC_POSTGRES_PASSWORD=ci\nSC_ENCRYPTION_KEY=ci\n' > "$RUNNER_TEMP/pull.env"
          docker compose --file "$RUNNER_TEMP/release/support-chatbot-$VERSION/compose.yaml" \
            --env-file "$RUNNER_TEMP/pull.env" --profile tools pull --policy missing --quiet
          (umask 077 && printf '%s' "$GH_TOKEN" > "$RUNNER_TEMP/token")
          # Our images are the ones just built, so only the others are pulled. The small
          # multilingual models development uses stand in for the defaults' gigabytes.
          # The backup repository is a local path, standing in for off-server storage.
          sudo "$RUNNER_TEMP/release/support-chatbot-$VERSION/sc" install \
            --domain localhost --registry-user "$GITHUB_ACTOR" --token-file "$RUNNER_TEMP/token" \
            --set SC_EMBEDDING_MODEL=intfloat/multilingual-e5-small \
            --set SC_RERANK_MODEL=cross-encoder/mmarco-mMiniLMv2-L12-H384-v1 \
            --set SC_RESTIC_REPOSITORY=/var/backups/support-chatbot
          rm "$RUNNER_TEMP/token"
      - name: Eight containers healthy, and the pages over HTTPS
        working-directory: /opt/support-chatbot
        run: |
          sudo docker compose ps --format '{{.Service}} {{.Health}}'
          test "$(sudo docker compose ps --format '{{.Health}}' | grep -c '^healthy$')" = 8
          sudo cat caddy-root.crt > "$RUNNER_TEMP/root.crt"
          get() { curl --fail --silent --show-error --cacert "$RUNNER_TEMP/root.crt" "https://localhost$1"; }
          get / | grep 'The dashboard arrives in M1'
          get /widget/ | grep 'The chat widget arrives in M1'
          get /api/health | jq --exit-status '.status == "ok" and .checks.worker == "ok"'
      - name: Only the service account can read the secrets
        run: |
          stat --format '%U %a' /opt/support-chatbot/.env | tee "$RUNNER_TEMP/env-mode.txt"
          test "$(cat "$RUNNER_TEMP/env-mode.txt")" = "supportchatbot 600"
          if cat /opt/support-chatbot/.env 2>/dev/null; then echo "Another user read .env"; exit 1; fi
      - name: A second install refuses
        run: |
          if sudo "$RUNNER_TEMP/release/support-chatbot-$VERSION/sc" install --domain localhost \
            --registry-user nobody --token-file /dev/null; then
            echo "sc install ran over an install"; exit 1
          fi
      - name: The cron entry backs up a marker row and a marker file
        working-directory: /opt/support-chatbot
        run: |
          sudo docker compose exec -T postgres psql --username=sc --dbname=support_chatbot \
            --command "CREATE TABLE ci_marker (note text); INSERT INTO ci_marker VALUES ('before the backup')"
          # As the API's own user, so the files volume must be writable by it.
          sudo docker compose exec -T api sh -c 'mkdir -p /data/files/kb && echo marker > /data/files/kb/marker.txt'
          # The command cron runs, run the way cron runs it: as the service account, from a login.
          entry=$(grep -E '^[0-9]' /etc/cron.d/support-chatbot)
          echo "$entry"
          test "$(echo "$entry" | awk '{print $6}')" = supportchatbot
          sudo runuser --login supportchatbot --shell /bin/sh --command "$(echo "$entry" | cut -d' ' -f7-)"
          sudo cat backup.log
          sudo cat backup-status.json | tee "$RUNNER_TEMP/status.json"
          jq --exit-status '.last_run.ok and .last_success == .last_run.at' "$RUNNER_TEMP/status.json"
      - name: sc restore onto a fresh install brings both back
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The vendor's password manager holds the old .env (ADR-0033). Then the server is lost.
          sudo cp /opt/support-chatbot/.env "$RUNNER_TEMP/old.env"
          (cd /opt/support-chatbot && sudo docker compose down)
          for volume in postgres_data valkey_data files restic_cache; do
            sudo docker volume rm "support-chatbot_$volume"
          done
          sudo rm -rf /opt/support-chatbot /etc/cron.d/support-chatbot
          df --human-readable /
          (umask 077 && printf '%s' "$GH_TOKEN" > "$RUNNER_TEMP/token")
          sudo "$RUNNER_TEMP/release/support-chatbot-$VERSION/sc" install \
            --domain localhost --registry-user "$GITHUB_ACTOR" --token-file "$RUNNER_TEMP/token" \
            --set SC_EMBEDDING_MODEL=intfloat/multilingual-e5-small \
            --set SC_RERANK_MODEL=cross-encoder/mmarco-mMiniLMv2-L12-H384-v1 \
            --set SC_RESTIC_REPOSITORY=/var/backups/support-chatbot
          rm "$RUNNER_TEMP/token"
          copy_from_old_env() {
            line=$(sudo grep "^$1=" "$RUNNER_TEMP/old.env")
            sudo sed -i "s|^$1=.*|$line|" /opt/support-chatbot/.env
          }
          # With the repository's password but not the old key, restore refuses and changes nothing.
          copy_from_old_env SC_RESTIC_PASSWORD
          if sudo /opt/support-chatbot/sc restore --yes 2> "$RUNNER_TEMP/refused.txt"; then
            echo "sc restore ran with another key"; exit 1
          fi
          cat "$RUNNER_TEMP/refused.txt"
          grep 'different SC_ENCRYPTION_KEY' "$RUNNER_TEMP/refused.txt"
          copy_from_old_env SC_ENCRYPTION_KEY
          sudo /opt/support-chatbot/sc restore --yes
          cd /opt/support-chatbot
          test "$(sudo docker compose exec -T postgres psql --username=sc --dbname=support_chatbot \
            --tuples-only --no-align --command 'SELECT note FROM ci_marker')" = 'before the backup'
          test "$(sudo docker compose exec -T api cat /data/files/kb/marker.txt)" = marker
          test "$(sudo docker compose ps --format '{{.Health}}' | grep -c '^healthy$')" = 8
          sudo cat caddy-root.crt > "$RUNNER_TEMP/root.crt"  # the service account's file
          curl --fail --silent --show-error --cacert "$RUNNER_TEMP/root.crt" \
            https://localhost/api/health | jq --exit-status '.status == "ok"'
      - name: sc upgrade to a new release, and back from a failed one
        run: |
          # Two releases made from the candidate: 0.0.1 adds a table; 0.0.2's migration fails.
          head=$(ls backend/migrations/versions | grep -E '^[0-9]+_' | sort | tail -n 1 | cut -d _ -f 1)
          release() {
            local version=$1 upgrades_from=$2 down=$head revision=9000
            cp -r backend "$RUNNER_TEMP/backend-$version"
            shift 2
            for body in "$@"; do
              revision=$((revision + 1))
              printf '"""CI: %s"""\nimport sqlalchemy as sa\nfrom alembic import op\n\nrevision = "%s"\ndown_revision = "%s"\n\n\ndef upgrade() -> None:\n    %s\n' \
                "$version" "$revision" "$down" "$body" > "$RUNNER_TEMP/backend-$version/migrations/versions/${revision}_ci.py"
              down=$revision
            done
            docker build --quiet --platform linux/amd64 --tag "$BACKEND:$version" "$RUNNER_TEMP/backend-$version"
            docker tag "$CADDY:$VERSION" "$CADDY:$version"
            python3 deploy/build_bundle.py "$version" "$RUNNER_TEMP/dist" --upgrades-from "$upgrades_from"
            tar --extract --gzip --file "$RUNNER_TEMP/dist/support-chatbot-$version.tar.gz" --directory "$RUNNER_TEMP/release"
          }
          table='op.create_table("ci_upgrade", sa.Column("id", sa.Integer(), primary_key=True))'
          release 0.0.1 "$VERSION" "$table"
          release 0.0.2 0.0.1 "$table" 'raise RuntimeError("CI: a migration that fails")'
          cd /opt/support-chatbot
          sql() {
            sudo docker compose exec -T postgres psql --username=sc --dbname=support_chatbot \
              --tuples-only --no-align --command "$1"
          }
          healthy() {
            test "$(sudo docker compose ps --format '{{.Health}}' | grep -c '^healthy$')" = 8
            sudo cat caddy-root.crt > "$RUNNER_TEMP/root.crt"
            curl --fail --silent --show-error --cacert "$RUNNER_TEMP/root.crt" \
              https://localhost/api/health | jq --exit-status '.status == "ok"'
          }

          sudo "$RUNNER_TEMP/release/support-chatbot-0.0.1/sc" upgrade 0.0.1
          sudo grep -x 'version=0.0.1' .installed
          test "$(sql "SELECT to_regclass('ci_upgrade') IS NOT NULL")" = t
          test "$(sql 'SELECT note FROM ci_marker')" = 'before the backup'
          healthy

          if sudo "$RUNNER_TEMP/release/support-chatbot-0.0.2/sc" upgrade 0.0.2 2> "$RUNNER_TEMP/failed.txt"; then
            echo "sc upgrade succeeded with a migration that fails"; exit 1
          fi
          cat "$RUNNER_TEMP/failed.txt"
          grep 'The upgrade to 0.0.2 failed while migrating the database' "$RUNNER_TEMP/failed.txt"
          grep 'Rolled back: 0.0.1 runs again' "$RUNNER_TEMP/failed.txt"
          sudo grep -x 'version=0.0.1' .installed
          sudo docker compose ps --format '{{.Service}} {{.Image}}' | grep -x "api $BACKEND:0.0.1"
          test "$(sql 'SELECT note FROM ci_marker')" = 'before the backup'
          healthy
          # Both upgrades left their pre-upgrade backup.
          sudo docker compose run --rm -T --volume /var/backups/support-chatbot:/var/backups/support-chatbot \
            restic snapshots --json --tag pre-upgrade | jq --exit-status 'length == 2'
      - name: sc status reports the install, and a stopped worker
        working-directory: /opt/support-chatbot
        run: |
          report() {
            set +e
            sudo /opt/support-chatbot/sc status > "$RUNNER_TEMP/status.txt"
            echo $? > "$RUNNER_TEMP/status-code.txt"
            set -e
            cat "$RUNNER_TEMP/status.txt"
          }
          report
          # Everything is ok except the registry token: the runner logged in with the workflow's
          # token, which GitHub does not date like a personal one. A warning exits 1.
          test "$(cat "$RUNNER_TEMP/status-code.txt")" = 1
          for label in Services Models Health Disk Queue 'Last backup'; do
            grep -E "^$label +ok " "$RUNNER_TEMP/status.txt"
          done
          grep -E '^Registry token +warning ' "$RUNNER_TEMP/status.txt"
          sudo docker compose stop worker
          report
          test "$(cat "$RUNNER_TEMP/status-code.txt")" = 2
          grep -E '^Services +problem .*worker \(exited\)' "$RUNNER_TEMP/status.txt"
      - name: Logs
        if: failure()
        run: |
          # The restore test removes the install before installing again.
          if [ -d /opt/support-chatbot ]; then
            cd /opt/support-chatbot && sudo docker compose logs --no-color
          fi

  upgrade:
    # OPS-4: the candidate upgrades the previous release's seeded database, and the previous
    # release still runs on the result, which sc upgrade's rollback relies on (ADR-0013). On a
    # release tag, publish runs the same test on the images it then pushes.
    name: Upgrade from the previous release
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    permissions:
      contents: read # the previous release's bundle
      packages: read # its images
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      VERSION: 0.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to Docker Hub, for a pull limit of our own
        # Anonymous pulls share the runners' addresses and hit Docker Hub's limit. Skipped where
        # the secrets are missing, such as a fork's pull request.
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build the candidate's backend image
        run: docker build --platform linux/amd64 --tag "$BACKEND:$VERSION" backend
      - name: Upgrade the previous release's seeded database
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          python3 deploy/upgrade_test.py --candidate "$VERSION"

  publish:
    name: Publish the release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the GitHub release
      packages: write # GitHub Container Registry
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Log in to Docker Hub, for a pull limit of our own
        # Anonymous pulls share the runners' addresses and hit Docker Hub's limit. Skipped where
        # the secrets are missing, such as a fork's pull request.
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: The tag is on main
        run: |
          # fetch-depth: 0 fetched origin/main with the tag. Fetching again would fail: checkout
          # dropped its credentials, and the repository is private.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      - name: Bundle and sc tests
        run: uv run --no-project --python 3.10 --with pytest==9.1.1 pytest deploy/tests
      - name: Build the images
        run: |
          labels=(
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.version=$VERSION"
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
          )
          docker build --platform linux/amd64 "${labels[@]}" --tag "$BACKEND:$VERSION" backend
          docker build --platform linux/amd64 "${labels[@]}" --tag "$CADDY:$VERSION" deploy/caddy
      - name: Scan the backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND }}:${{ env.VERSION }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the Caddy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CADDY }}:${{ env.VERSION }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upgrade the previous release's seeded database, with these images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          python3 deploy/upgrade_test.py --candidate "$VERSION" --release-tag "$GITHUB_REF_NAME" \
            --tested-from "$RUNNER_TEMP/upgrades-from"
      - name: Push the images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$BACKEND:$VERSION"
          docker push "$CADDY:$VERSION"
          docker logout ghcr.io
      - name: Publish the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The bundle accepts upgrades from the release the upgrade test started from (ADR-0034).
          python3 deploy/build_bundle.py "$VERSION" dist --upgrades-from "$(cat "$RUNNER_TEMP/upgrades-from")"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            "dist/support-chatbot-$VERSION.tar.gz" "dist/support-chatbot-$VERSION.tar.gz.sha256"
