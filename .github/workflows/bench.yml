name: Benchmark harness

# Checks the M0 benchmark harness (#12), then runs it briefly on x86-64 against the stack, with
# a small model in the stack's own Ollama. It runs when bench/ changes, except its README, or by
# hand.

on:
  pull_request:
    paths:
      - bench/**
      - "!bench/README.md"
      - .github/workflows/bench.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Bench checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          working-directory: bench
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  run:
    name: Short run on x86-64
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # Run the stack's own Ollama, which development leaves out by default.
      COMPOSE_PROFILES: ollama
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to Docker Hub, for a pull limit of our own
        # Anonymous pulls share the runners' addresses and hit Docker Hub's limit. Skipped where
        # the secrets are missing, such as a fork's pull request.
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Make room for the Ollama image
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 900
      - name: Pull a small model
        # Qwen2.5 0.5B, Apache-2.0: enough to drive both model steps, about 400 MB.
        run: docker compose exec -T ollama ollama pull qwen2.5:0.5b
      - name: Build the harness
        working-directory: bench
        run: docker compose build
      - name: Tests against the stack
        working-directory: bench
        run: docker compose run --rm --entrypoint pytest bench -m stack -p no:cacheprovider
      - name: Run with a small model as the classifier
        working-directory: bench
        run: docker compose run --rm bench run configs/ci.toml
      - name: Run with the embedding check as the classifier
        working-directory: bench
        run: docker compose run --rm bench run configs/ci-embedding.toml
      - name: Classify only, with a small model
        working-directory: bench
        run: docker compose run --rm bench run configs/ci.toml --classify-only --turns 10 --label classify-only
      - name: Classify only, with the embedding check, over every sample
        working-directory: bench
        run: docker compose run --rm bench run configs/ci-embedding.toml --classify-only --label classify-only
      - name: Every turn ran and was scored, and every level measured the stack
        working-directory: bench
        run: |
          for results in results/*.json; do
            jq --exit-status '
              (.levels | length) > 0
              and all(.levels[]; .stats.errors == 0 and .stats.turns > 0
                and (.resources.memory_peak | has("ollama") and has("tei-embed") and has("tei-rerank")))
              and .scores.classification.turns == ([.levels[].turns | length] | add)
              and (.scores.classification.unknown | length) == 0
            ' "$results"
          done
          cat results/*.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench/results/
          if-no-files-found: ignore
          retention-days: 30
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
