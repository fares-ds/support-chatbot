name: Benchmark harness

# Checks the M0 benchmark harness (#12), then runs it briefly on x86-64 against the stack, with
# a small model in the stack's own Ollama. It runs when bench/ changes, or by hand.

on:
  pull_request:
    paths:
      - bench/**
      - .github/workflows/bench.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Bench checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          working-directory: bench
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  run:
    name: Short run on x86-64
    runs-on: ubuntu-24.04
    env:
      # Run the stack's own Ollama, which development leaves out by default.
      COMPOSE_PROFILES: ollama
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make room for the Ollama image
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 900
      - name: Pull a small model
        # Qwen2.5 0.5B, Apache-2.0: enough to drive both model steps, about 400 MB.
        run: docker compose exec -T ollama ollama pull qwen2.5:0.5b
      - name: Build the harness
        working-directory: bench
        run: docker compose build
      - name: Tests against the stack
        working-directory: bench
        run: docker compose run --rm --entrypoint pytest bench -m stack -p no:cacheprovider
      - name: Run with a small model as the classifier
        working-directory: bench
        run: docker compose run --rm bench run configs/ci.toml
      - name: Run with the embedding check as the classifier
        working-directory: bench
        run: docker compose run --rm bench run configs/ci-embedding.toml
      - name: Every turn ran, and every level measured the stack
        working-directory: bench
        run: |
          for results in results/*.json; do
            jq --exit-status '
              (.levels | length) > 0
              and all(.levels[]; .stats.errors == 0 and .stats.turns > 0
                and (.resources.memory_peak | has("ollama") and has("tei-embed") and has("tei-rerank")))
            ' "$results"
          done
          cat results/*.md >> "$GITHUB_STEP_SUMMARY"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
