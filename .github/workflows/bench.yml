name: Benchmark harness

# Checks the M0 benchmark harness (#12): lint, types and tests. It runs when bench/ changes, except
# its README and reports, once the pull request is ready for review, or by hand. The knowledge-base
# articles are Markdown too, but they are data the tests load. The short run on x86-64 is
# bench-run.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - bench/**
      - "!bench/README.md"
      - "!bench/reports/**"
      - .github/workflows/bench.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Bench checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          working-directory: bench
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest
