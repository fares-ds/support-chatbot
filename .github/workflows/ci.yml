name: CI

# Runs on every pull request once it is ready for review, unless it changes only docs (Markdown or
# docs/) or the benchmark, which bench.yml checks. A draft skips it, since its second review and the
# fixes come first (ADR-0036), so a pull request runs CI once. Merging doesn't run it again: the pull
# request ran on its merge with main as it was then. Main runs it every Monday instead, which
# catches pull requests that pass alone but break together, and by hand before a release tag
# (deploy/README.md). By hand, it also runs on any branch.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - bench/**
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push replaces a pull request's run; on main, a run by hand and Monday's both finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
      # In this job rather than its own: GitHub bills each job at least a minute.
      - name: Every third-party action is pinned by commit SHA
        working-directory: .
        run: |
          # A tag can be moved to other code; a commit SHA cannot.
          unpinned=$(grep -rhoE '^[[:space:]]*(- )?uses:[[:space:]]*[^[:space:]]+' .github/workflows \
            | sed -E 's/.*uses:[[:space:]]*//' | grep -vE '^\./' | grep -vE '@[0-9a-f]{40}$' || true)
          if [ -n "$unpinned" ]; then
            echo "Pin these actions by commit SHA:"
            echo "$unpinned"
            exit 1
          fi
          grep -rhoE 'uses:[[:space:]]*[^[:space:]]+' .github/workflows | sort | uniq -c
      - name: Every pull request job skips drafts
        # A draft's second review and fixes come before its one CI run (ADR-0036). A job without
        # the check would run on every push to a draft, and spend the account's few free minutes.
        working-directory: .
        run: |
          uv run --no-project --python 3.12 --with pyyaml==6.0.2 python - <<'EOF'
          import pathlib
          import sys

          import yaml

          problems = []
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              workflow = yaml.safe_load(path.read_text())
              triggers = workflow.get("on", workflow.get(True))  # YAML 1.1 reads a bare `on` as true
              if not isinstance(triggers, dict) or "pull_request" not in triggers:
                  continue
              if "ready_for_review" not in (triggers["pull_request"] or {}).get("types", []):
                  problems.append(f"{path.name}: pull_request needs ready_for_review in its types")
              for name, job in workflow["jobs"].items():
                  condition = str(job.get("if", ""))
                  if "pull_request.draft" not in condition and "github.event_name == 'push'" not in condition:
                      problems.append(f"{path.name}: job {name} runs on drafts")
          print("\n".join(problems) or "Every pull request job skips drafts.")
          sys.exit(1 if problems else 0)
          EOF
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Migration rules
        run: uv run python -m tools.migration_rules migrations/versions

  contract:
    # ADR-0026: the frontend's API client and event types are generated from the backend, and
    # committed. A backend change that alters them must commit the regenerated code with it.
    name: API client and event types
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json # its packageManager field pins pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Regenerate from the backend
        run: pnpm generate
      - name: The committed client matches the backend
        run: |
          if [ -n "$(git status --porcelain -- .)" ]; then
            git status --short -- .
            git diff -- .
            echo "The API client or the event types differ from the backend: run pnpm --dir frontend generate, and commit the result."
            exit 1
          fi
      - name: Types
        run: pnpm typecheck

  stack:
    name: Compose stack
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # Run the stack's own Ollama, which development leaves out by default.
      COMPOSE_PROFILES: ollama
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to Docker Hub, for a pull limit of our own
        # Anonymous pulls share the runners' addresses and hit Docker Hub's limit. Skipped where
        # the secrets are missing, such as a fork's pull request.
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Make room for the Ollama image
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 900
      - name: The migration job ran before the API and the worker
        run: |
          docker compose ps --all --format '{{.Service}} {{.State}} {{.ExitCode}}' migrate | tee "$RUNNER_TEMP/migrate.txt"
          test "$(cat "$RUNNER_TEMP/migrate.txt")" = "migrate exited 0"
          migrated=$(docker inspect --format '{{.State.FinishedAt}}' "$(docker compose ps --all --quiet migrate)")
          for service in api worker; do
            if docker compose logs --no-color "$service" | grep -q alembic; then
              echo "$service migrated on startup"; exit 1
            fi
            started=$(docker inspect --format '{{.State.StartedAt}}' "$(docker compose ps --quiet "$service")")
            echo "migrate finished $migrated; $service started $started"
            test "$(date -d "$migrated" +%s%N)" -le "$(date -d "$started" +%s%N)"
          done
      - name: Health through Caddy over HTTPS
        run: |
          for attempt in 1 2 3 4 5; do
            docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt" && break
            sleep 2
          done
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --cacert "$RUNNER_TEMP/caddy-root.crt" https://localhost/api/health | tee "$RUNNER_TEMP/health.json"
          jq --exit-status '.status == "ok" and .worker_heartbeat != null and .checks == {
            "postgres": "ok", "valkey": "ok", "tei_embed": "ok", "tei_rerank": "ok", "ollama": "ok",
            "worker": "ok"
          }' "$RUNNER_TEMP/health.json"
          # Revisions are numbered, so the newest file is the head.
          head=$(ls backend/migrations/versions | grep -E '^[0-9]+_' | sort | tail -n 1 | cut -d _ -f 1)
          jq --exit-status --arg head "$head" '.schema_revision == $head' "$RUNNER_TEMP/health.json"
      - name: Beat schedules the worker's heartbeat
        run: |
          beat() {
            curl --fail --silent --cacert "$RUNNER_TEMP/caddy-root.crt" https://localhost/api/health \
              | jq --raw-output .worker_heartbeat
          }
          first=$(beat)
          echo "Last beat: $first"
          for attempt in $(seq 30); do
            [ "$(beat)" != "$first" ] && break
            sleep 3
          done
          echo "Next beat: $(beat)"
          test "$(beat)" != "$first"
          docker compose logs --no-color worker | grep 'Sending due task heartbeat'
      - name: Migrating again changes nothing
        run: |
          schema() {
            docker compose exec -T postgres pg_dump --schema-only --username=sc support_chatbot \
              | grep -v '^\\\(un\)\?restrict '
          }
          schema > "$RUNNER_TEMP/schema-before.sql"
          docker compose run --rm migrate
          schema > "$RUNNER_TEMP/schema-after.sql"
          diff "$RUNNER_TEMP/schema-before.sql" "$RUNNER_TEMP/schema-after.sql"
          grep -q 'CREATE EXTENSION IF NOT EXISTS vector' "$RUNNER_TEMP/schema-after.sql"
      - name: A rolled-back release leaves a newer schema alone
        run: |
          # A rollback runs the previous release's migration job on a schema a newer release
          # migrated. It must leave it as it is and succeed, or the API never starts (ADR-0013).
          revision() {
            docker compose exec -T postgres psql --username=sc --dbname=support_chatbot \
              --tuples-only --no-align --command "$1"
          }
          head=$(revision 'SELECT version_num FROM alembic_version')
          revision "UPDATE alembic_version SET version_num = '9999'"
          docker compose run --rm migrate 2>&1 | tee "$RUNNER_TEMP/rollback.log"
          grep -q 'revision this release does not know' "$RUNNER_TEMP/rollback.log"
          test "$(revision 'SELECT version_num FROM alembic_version')" = 9999
          revision "UPDATE alembic_version SET version_num = '$head'"
      - name: Only Caddy publishes ports
        run: |
          published=$(docker compose ps --format '{{.Service}} {{.Ports}}' | grep -- '->' | cut -d ' ' -f 1 | sort -u)
          echo "Services with published ports: $published"
          test "$published" = caddy
      - name: Valkey never evicts
        run: test "$(docker compose exec -T valkey valkey-cli config get maxmemory-policy | tail -n 1)" = noeviction
      - name: TEI embeds and reranks
        run: |
          docker compose exec -T api python - <<'EOF'
          import json
          import urllib.request

          def post(url, body):
              request = urllib.request.Request(url, json.dumps(body).encode(), {"Content-Type": "application/json"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          vectors = post("http://tei-embed/embed", {"inputs": ["Comment changer de forfait ?", "كيف أغير اشتراكي؟"]})
          assert len(vectors) == 2 and len(vectors[0]) > 0, vectors
          query = "How do I change my plan?"
          texts = ["Our office is in Algiers.", "You can change your plan in Settings, at any time."]
          ranking = post("http://tei-rerank/rerank", {"query": query, "texts": texts})
          assert ranking[0]["index"] == 1, ranking
          print(f"{len(vectors[0])} dimensions; rerank order {[item['index'] for item in ranking]}")
          EOF
      - name: Restarting keeps the models
        run: |
          blobs() {
            for service in tei-embed tei-rerank; do
              docker compose exec -T "$service" sh -c 'ls -l --time-style=+%s /data/models--*/blobs | grep -v "\.lock$"'
            done
          }
          blobs > "$RUNNER_TEMP/before.txt"
          docker compose restart tei-embed tei-rerank
          for attempt in $(seq 60); do
            [ "$(docker compose ps --format '{{.Health}}' tei-embed tei-rerank | sort -u)" = healthy ] && break
            sleep 2
          done
          test "$(docker compose ps --format '{{.Health}}' tei-embed tei-rerank | sort -u)" = healthy
          blobs > "$RUNNER_TEMP/after.txt"
          diff "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt"
      - name: The model services do not affect readiness
        run: |
          docker compose stop ollama
          code=$(curl --silent --output "$RUNNER_TEMP/health.json" --write-out '%{http_code}' \
            --cacert "$RUNNER_TEMP/caddy-root.crt" https://localhost/api/health)
          cat "$RUNNER_TEMP/health.json"
          test "$code" = 503
          jq --exit-status '.status == "down" and .checks.ollama == "down"' "$RUNNER_TEMP/health.json"
          curl --fail --silent --show-error --cacert "$RUNNER_TEMP/caddy-root.crt" \
            https://localhost/api/health/ready | tee "$RUNNER_TEMP/ready.json"
          jq --exit-status '.status == "ok" and .checks == {"postgres": "ok", "valkey": "ok"}' "$RUNNER_TEMP/ready.json"
      - name: Not ready without Valkey
        run: |
          docker compose stop valkey
          code=$(curl --silent --output "$RUNNER_TEMP/ready.json" --write-out '%{http_code}' \
            --cacert "$RUNNER_TEMP/caddy-root.crt" https://localhost/api/health/ready)
          cat "$RUNNER_TEMP/ready.json"
          test "$code" = 503
          jq --exit-status '.status == "down" and .checks == {"postgres": "ok", "valkey": "down"}' "$RUNNER_TEMP/ready.json"
      - name: The worker is unhealthy without Valkey
        run: |
          # Valkey is still stopped from the previous step.
          if docker compose exec -T worker python -m app.worker_healthcheck; then
            echo "The worker's health check passed without Valkey"; exit 1
          fi
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
