name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Migration rules
        run: uv run python -m tools.migration_rules migrations/versions

  stack:
    name: Compose stack
    runs-on: ubuntu-24.04
    env:
      # Run the stack's own Ollama, which development leaves out by default.
      COMPOSE_PROFILES: ollama
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make room for the Ollama image
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 900
      - name: The migration job ran before the API
        run: |
          docker compose ps --all --format '{{.Service}} {{.State}} {{.ExitCode}}' migrate | tee "$RUNNER_TEMP/migrate.txt"
          test "$(cat "$RUNNER_TEMP/migrate.txt")" = "migrate exited 0"
          docker compose logs --no-color api | grep -q alembic && { echo "The API migrated on startup"; exit 1; } || true
          migrated=$(docker inspect --format '{{.State.FinishedAt}}' "$(docker compose ps --all --quiet migrate)")
          started=$(docker inspect --format '{{.State.StartedAt}}' "$(docker compose ps --quiet api)")
          echo "migrate finished $migrated; api started $started"
          test "$(date -d "$migrated" +%s%N)" -le "$(date -d "$started" +%s%N)"
      - name: Health through Caddy over HTTPS
        run: |
          for attempt in 1 2 3 4 5; do
            docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt" && break
            sleep 2
          done
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --cacert "$RUNNER_TEMP/caddy-root.crt" https://localhost/api/health | tee "$RUNNER_TEMP/health.json"
          jq --exit-status '.status == "ok" and .checks == {
            "postgres": "ok", "valkey": "ok", "tei_embed": "ok", "tei_rerank": "ok", "ollama": "ok"
          }' "$RUNNER_TEMP/health.json"
          # Revisions are numbered, so the newest file is the head.
          head=$(ls backend/migrations/versions | grep -E '^[0-9]+_' | sort | tail -n 1 | cut -d _ -f 1)
          jq --exit-status --arg head "$head" '.schema_revision == $head' "$RUNNER_TEMP/health.json"
      - name: Migrating again changes nothing
        run: |
          schema() {
            docker compose exec -T postgres pg_dump --schema-only --username=sc support_chatbot \
              | grep -v '^\\\(un\)\?restrict '
          }
          schema > "$RUNNER_TEMP/schema-before.sql"
          docker compose run --rm migrate
          schema > "$RUNNER_TEMP/schema-after.sql"
          diff "$RUNNER_TEMP/schema-before.sql" "$RUNNER_TEMP/schema-after.sql"
          grep -q 'CREATE EXTENSION IF NOT EXISTS vector' "$RUNNER_TEMP/schema-after.sql"
      - name: Only Caddy publishes ports
        run: |
          published=$(docker compose ps --format '{{.Service}} {{.Ports}}' | grep -- '->' | cut -d ' ' -f 1 | sort -u)
          echo "Services with published ports: $published"
          test "$published" = caddy
      - name: Valkey never evicts
        run: test "$(docker compose exec -T valkey valkey-cli config get maxmemory-policy | tail -n 1)" = noeviction
      - name: TEI embeds and reranks
        run: |
          docker compose exec -T api python - <<'EOF'
          import json
          import urllib.request

          def post(url, body):
              request = urllib.request.Request(url, json.dumps(body).encode(), {"Content-Type": "application/json"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          vectors = post("http://tei-embed/embed", {"inputs": ["Comment changer de forfait ?", "كيف أغير اشتراكي؟"]})
          assert len(vectors) == 2 and len(vectors[0]) > 0, vectors
          query = "How do I change my plan?"
          texts = ["Our office is in Algiers.", "You can change your plan in Settings, at any time."]
          ranking = post("http://tei-rerank/rerank", {"query": query, "texts": texts})
          assert ranking[0]["index"] == 1, ranking
          print(f"{len(vectors[0])} dimensions; rerank order {[item['index'] for item in ranking]}")
          EOF
      - name: Restarting keeps the models
        run: |
          blobs() {
            for service in tei-embed tei-rerank; do
              docker compose exec -T "$service" sh -c 'ls -l --time-style=+%s /data/models--*/blobs | grep -v "\.lock$"'
            done
          }
          blobs > "$RUNNER_TEMP/before.txt"
          docker compose restart tei-embed tei-rerank
          for attempt in $(seq 60); do
            [ "$(docker compose ps --format '{{.Health}}' tei-embed tei-rerank | sort -u)" = healthy ] && break
            sleep 2
          done
          test "$(docker compose ps --format '{{.Health}}' tei-embed tei-rerank | sort -u)" = healthy
          blobs > "$RUNNER_TEMP/after.txt"
          diff "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt"
      - name: The model services do not affect readiness
        run: |
          docker compose stop ollama
          code=$(curl --silent --output "$RUNNER_TEMP/health.json" --write-out '%{http_code}' \
            --cacert "$RUNNER_TEMP/caddy-root.crt" https://localhost/api/health)
          cat "$RUNNER_TEMP/health.json"
          test "$code" = 503
          jq --exit-status '.status == "down" and .checks.ollama == "down"' "$RUNNER_TEMP/health.json"
          curl --fail --silent --show-error --cacert "$RUNNER_TEMP/caddy-root.crt" \
            https://localhost/api/health/ready | tee "$RUNNER_TEMP/ready.json"
          jq --exit-status '.status == "ok" and .checks == {"postgres": "ok", "valkey": "ok"}' "$RUNNER_TEMP/ready.json"
      - name: Not ready without Valkey
        run: |
          docker compose stop valkey
          code=$(curl --silent --output "$RUNNER_TEMP/ready.json" --write-out '%{http_code}' \
            --cacert "$RUNNER_TEMP/caddy-root.crt" https://localhost/api/health/ready)
          cat "$RUNNER_TEMP/ready.json"
          test "$code" = 503
          jq --exit-status '.status == "down" and .checks == {"postgres": "ok", "valkey": "down"}' "$RUNNER_TEMP/ready.json"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
