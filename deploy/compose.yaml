# The install bundle's Compose file (ADR-0027). It reads its settings from the .env file next
# to it, which the server CLI writes. For development, use the compose.yaml at the repository root.
#
# Only Caddy publishes ports (SEC-14). Caddy and the API share the edge network; the API and the
# data services share the backend network, so Caddy cannot reach Postgres or Valkey.

name: support-chatbot

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "${SC_HTTP_PORT:-80}:80"
      - "${SC_HTTPS_PORT:-443}:443"
      - "${SC_HTTPS_PORT:-443}:443/udp"
    environment:
      SC_DOMAIN: ${SC_DOMAIN:?SC_DOMAIN is not set}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Caddy's admin API, which listens inside the container only.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    logging: *logging

  api:
    image: ghcr.io/fares-ds/support-chatbot-backend:${SC_VERSION:?SC_VERSION is not set}
    restart: unless-stopped
    environment:
      SC_ENVIRONMENT: ${SC_ENVIRONMENT:-production}
      SC_POSTGRES_PASSWORD: ${SC_POSTGRES_PASSWORD:?SC_POSTGRES_PASSWORD is not set}
    networks: [edge, backend]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    logging: *logging

  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: sc
      POSTGRES_PASSWORD: ${SC_POSTGRES_PASSWORD:?SC_POSTGRES_PASSWORD is not set}
      POSTGRES_DB: support_chatbot
    volumes:
      # From Postgres 18 the image keeps its data under /var/lib/postgresql/<major>/.
      - postgres_data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      # Over TCP, so the temporary server that runs during first-time setup does not count.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=sc", "--dbname=support_chatbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    logging: *logging

  valkey:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    # Celery needs keys never evicted (OPS-11). The append-only file keeps queued jobs across restarts.
    command: ["valkey-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s
    logging: *logging

networks:
  edge:
  backend:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  valkey_data:
