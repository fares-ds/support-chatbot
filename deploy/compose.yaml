# The install bundle's Compose file (ADR-0027). It reads its settings from the .env file next
# to it, which the server CLI writes. For development, use the compose.yaml at the repository root.
#
# Only Caddy publishes ports (SEC-14). Caddy and the API share the edge network; the API and the
# data services share the backend network, so Caddy cannot reach Postgres or Valkey.

name: support-chatbot

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "${SC_HTTP_PORT:-80}:80"
      - "${SC_HTTPS_PORT:-443}:443"
      - "${SC_HTTPS_PORT:-443}:443/udp"
    environment:
      SC_DOMAIN: ${SC_DOMAIN:?SC_DOMAIN is not set}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Caddy's admin API, which listens inside the container only.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    logging: *logging

  api:
    image: ghcr.io/fares-ds/support-chatbot-backend:${SC_VERSION:?SC_VERSION is not set}
    restart: unless-stopped
    environment:
      SC_ENVIRONMENT: ${SC_ENVIRONMENT:-production}
      SC_POSTGRES_PASSWORD: ${SC_POSTGRES_PASSWORD:?SC_POSTGRES_PASSWORD is not set}
      SC_OLLAMA_URL: ${SC_OLLAMA_URL:-http://ollama:11434}
    networks: [edge, backend]
    # Not on the model services: live chat works without them, because the AI hands off.
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      # Readiness covers Postgres and Valkey only; /api/health reports the model services too.
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    logging: *logging

  # The migration job (ADR-0013): it migrates the database to the newest revision and exits. The
  # API starts only after it succeeds, and never migrates on startup. Running it again changes
  # nothing.
  migrate:
    image: ghcr.io/fares-ds/support-chatbot-backend:${SC_VERSION:?SC_VERSION is not set}
    command: ["python", "-m", "app.migrate"]
    restart: "no"
    environment:
      SC_ENVIRONMENT: ${SC_ENVIRONMENT:-production}
      SC_POSTGRES_PASSWORD: ${SC_POSTGRES_PASSWORD:?SC_POSTGRES_PASSWORD is not set}
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: sc
      POSTGRES_PASSWORD: ${SC_POSTGRES_PASSWORD:?SC_POSTGRES_PASSWORD is not set}
      POSTGRES_DB: support_chatbot
    volumes:
      # From Postgres 18 the image keeps its data under /var/lib/postgresql/<major>/.
      - postgres_data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      # Over TCP, so the temporary server that runs during first-time setup does not count.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=sc", "--dbname=support_chatbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    logging: *logging

  valkey:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    # Celery needs keys never evicted (OPS-11). The append-only file keeps queued jobs across restarts.
    command: ["valkey-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s
    logging: *logging

  # One model per TEI container (ADR-0028). An ARM64 server sets SC_TEI_TAG=cpu-arm64-1.9.4.
  # Memory, measured on TEI 1.9.4 (#4):
  # - TEI warms up with a full batch of max-batch-tokens. With --auto-truncate that is also the
  #   longest input. bge-m3 and bge-reranker-v2-m3 accept 8,192 tokens, and warming up at that
  #   length ran a 7 GB machine out of memory. Chunks are under 600 tokens, so 2,048 is plenty;
  #   longer inputs are cut, not refused.
  # - Each tokenization worker holds its own copy of the tokenizer: about 230 MB for these
  #   multilingual models. TEI starts one per CPU by default, so we set 2.
  # The M0 benchmark tunes both values.
  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:${SC_TEI_TAG:-cpu-1.9.4}
    restart: unless-stopped
    command:
      - --model-id=${SC_EMBEDDING_MODEL:-BAAI/bge-m3}
      - --max-batch-tokens=${SC_TEI_MAX_BATCH_TOKENS:-2048}
      - --tokenization-workers=${SC_TEI_TOKENIZATION_WORKERS:-2}
      - --auto-truncate
      - --json-output
    volumes:
      - tei_embed_models:/data
    networks: [backend]
    healthcheck: &tei-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      # The first start downloads the model: bge-m3 is 2.3 GB. Cached restarts pass within seconds.
      start_period: 30m
      start_interval: 5s
    logging: *logging

  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:${SC_TEI_TAG:-cpu-1.9.4}
    restart: unless-stopped
    command:
      - --model-id=${SC_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      - --max-batch-tokens=${SC_TEI_MAX_BATCH_TOKENS:-2048}
      - --tokenization-workers=${SC_TEI_TOKENIZATION_WORKERS:-2}
      - --auto-truncate
      - --json-output
    volumes:
      - tei_rerank_models:/data
    networks: [backend]
    healthcheck: *tei-healthcheck
    logging: *logging

  ollama:
    image: ollama/ollama:0.40.0
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks: [backend]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    logging: *logging

networks:
  edge:
  backend:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  valkey_data:
  tei_embed_models:
  tei_rerank_models:
  ollama_models:
