# The classifier bake-off (#14), in Ollama's cloud; see gate1-gpt-oss-20b.toml. gemma4:cloud is
# Gemma 4 31B: Ollama's cloud has no smaller Gemma 4.

name = "gate1-gemma4-31b"

[classifier]
mode = "model"
model = "ollama_chat/gemma4:cloud"
reasoning_effort = "none"

[answer]                              # unused with --classify-only
model = "ollama_chat/gemma4:cloud"
reasoning_effort = "none"

[run]
concurrency = [4]
warmup = 2
