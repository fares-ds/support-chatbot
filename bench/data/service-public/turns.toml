expect = "answer"
facts = ["No: an opposition is final, and the card cannot be put back into service even if it is found"]
sources = ["fr-perte-carte-bancaire.md#Cas général > Où s’adresser ? | fr-vol-carte-bancaire.md#Cas général > Où s’adresser ?"]

