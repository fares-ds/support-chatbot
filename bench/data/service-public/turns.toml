# Service-Public.fr's samples (#13): Gate 1's four categories in French, and questions over the
# money and consumer guides in kb/, which are real public pages (see sources.toml). Their
# markup survives extraction badly, so a source names the section the text lands in after
# chunking, even when its heading reads oddly.
#
# Each turn: id, language, message, category, and optionally interface_language, history,
# offered_person, cases and note. An on-topic turn expects an answer, with the facts it must
# state (in English) and its sources, or a handoff. A source reads file.md#Heading > Below it;
# " | " separates other places that state the same facts.

[business]
name = "Service-Public.fr : argent et consommation"
description = "Les fiches pratiques de Service-Public.fr pour les particuliers en France, sur l'argent et la consommation : comptes bancaires, frais et découvert, cartes et moyens de paiement, virements et prélèvements, perte, vol et fraude à la carte, médiateur bancaire, achats à distance, livraison, rétractation et garanties."

[[turns]]
id = "fr-opposition-numero"
language = "fr"
message = "J'ai perdu ma carte bancaire, quel numéro appeler pour faire opposition ?"
category = "on_topic"
expect = "answer"
facts = ["Contact your bank, or call the interbank opposition line on 0 892 705 705, open 24/7 (a premium-rate number)"]
sources = ["fr-perte-carte-bancaire.md#Cas général > Où s’adresser ? | fr-vol-carte-bancaire.md#Cas général > Où s’adresser ? | fr-perte-carte-bancaire.md#À l'étranger > Où s’adresser ?"]

[[turns]]
