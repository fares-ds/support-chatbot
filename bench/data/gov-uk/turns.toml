# GOV.UK's samples (#13): Gate 1's four categories in English, and questions over DVLA's pages in
# kb/, which are real public pages (see sources.toml). Answer models may already know some of
# these answers, which tests whether they keep to the sources.
#
# Each turn: id, language, message, category, and optionally interface_language, history,
# offered_person, cases and note. An on-topic turn expects an answer, with the facts it must
# state and its sources, or a handoff. A source reads file.md#Heading > Below it; " | "
# separates other places that state the same facts.

[business]
name = "GOV.UK: driving and vehicles"
description = "GOV.UK's guidance from the Driver and Vehicle Licensing Agency (DVLA) for drivers and vehicle keepers in Great Britain: driving licences (applying, renewing, replacing, changing name or address), vehicle tax, Direct Debits and refunds, SORN, buying, selling and writing off vehicles, penalty points, speeding, and DVLA fines."

[[turns]]
id = "en-renew-cost-online"
language = "en"
message = "How much does it cost to renew my driving licence online?"
category = "on_topic"
expect = "answer"
facts = ["£14 online"]
sources = ["en-renew-driving-licence.md#How much it costs | en-driving-licence-fees.md#Renew a driving licence"]

