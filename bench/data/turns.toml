# Sample turns for the benchmark: on-topic questions, all answerable from data/kb/, some of them
# follow-ups that need the earlier messages. Placeholders written for #12 about a fictional
# business, Acme Mobile, until #13 brings reviewed datasets; the Arabic and Darija ones are
# unreviewed.
#
# Each turn: id, language (en, fr, ar or darija), interface_language (the widget's: en, fr or ar;
# defaults to the language), message, and optionally history (earlier messages, oldest first)
# and offered_person (the AI's last message offered a person).

[business]
name = "Acme Mobile"
description = "Acme Mobile is a mobile operator in Algeria. The assistant helps customers with plans and prices, bills and payments, prepaid credit and top-ups, SIM and eSIM cards, roaming, network coverage, their account and its security, and contracts."

# English

[[turns]]
id = "en-plan-change"
language = "en"
message = "Can I move from Basic to Plus in the middle of the month, and what would I pay?"

[[turns]]
id = "en-family"
language = "en"
history = [
    { role = "customer", text = "How much is the Pro plan?" },
    { role = "ai", text = "Pro costs 3,500 DA a month. It includes unlimited data at full speed up to 200 GB, unlimited calls and texts to every network in Algeria, and 120 minutes of international calls to zone 1 [1]." },
]
message = "And if I add my two kids on a family plan, what do their lines cost?"

[[turns]]
id = "en-late-payment"
language = "en"
message = "My bill was due last week and I still haven't paid it. Will you cut my line?"

[[turns]]
id = "en-roaming-spain"
language = "en"
message = "I'm going to Spain for five days next month. What's the cheapest way to use data there?"

[[turns]]
id = "en-dispute"
language = "en"
history = [
    { role = "customer", text = "There's a charge of 1,500 DA on my last bill that I don't understand." },
    { role = "ai", text = "Sorry about that. What is the charge called on your bill?" },
]
message = "It says roaming data, but I never left Algeria. Can I get that money back?"

# French

[[turns]]
id = "fr-transfert"
language = "fr"
message = "Comment je peux envoyer du crédit à ma sœur ? Elle est aussi chez Acme."

[[turns]]
id = "fr-options"
language = "fr"
message = "Quelle option internet prendre pour une semaine, et est-ce qu'elle se renouvelle toute seule ?"

[[turns]]
id = "fr-esim"
language = "fr"
message = "Je viens d'acheter un nouveau téléphone. Comment je passe mon numéro sur une eSIM ?"

[[turns]]
id = "fr-vol"
language = "fr"
message = "On m'a volé mon téléphone ce matin. Qu'est-ce que je dois faire pour ma ligne ?"

[[turns]]
id = "fr-phishing"
language = "fr"
history = [
    { role = "customer", text = "J'ai reçu un SMS qui dit que ma ligne sera coupée si je ne paie pas une facture sur un lien." },
    { role = "ai", text = "Ce message ne vient pas d'Acme Mobile : nos SMS viennent toujours de l'expéditeur « ACME » et nos liens mènent à acme-mobile.example [1]. Ne cliquez pas sur le lien." },
]
message = "Trop tard, j'ai cliqué et j'ai donné un code reçu par SMS. C'est grave ?"

