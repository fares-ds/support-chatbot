# Acme Pay's samples (#13): Gate 1's four categories and the questions Gate 3 answers, in Arabic
# and Darija (Latin and Arabic script), with some in French and English as the beta's customers
# write those too. Acme Pay is fictional; see sources.toml.
#
# Each turn: id, language (en, fr, ar or darija), interface_language (the widget's: en, fr or
# ar), message, category, and optionally history (earlier messages, oldest first),
# offered_person, cases and note. An on-topic turn expects an answer, with the facts it must
# state (in English) and its sources, or a handoff. A source reads file.md#Heading > Below it;
# " | " separates copies of the same section, such as its translation.

[business]
name = "Acme Pay"
description = "Acme Pay est une application algérienne de paiement mobile. L'assistant aide les clients avec leur compte et sa vérification, l'alimentation du portefeuille et les retraits vers un CCP, les envois d'argent, les recharges mobiles et internet Idoom, les cartes cadeaux et crédits de jeux, le paiement des factures, les frais et plafonds, la sécurité du compte, le parrainage et le programme commerçants."

