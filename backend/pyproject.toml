[project]
name = "support-chatbot-backend"
version = "0.0.0"
description = "Support Chatbot's API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.uv]
# An application, not a library: uv installs the dependencies only, and the image copies app/.
package = false
required-version = ">=0.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and pass made-up passwords to Settings.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["app", "migrations", "tools", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.alembic]
# For `uv run alembic revision` while developing. Installs migrate with `python -m app.migrate`,
# which needs no configuration file (ADR-0013).
script_location = "%(here)s/migrations"
file_template = "%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]
